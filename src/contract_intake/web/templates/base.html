<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}contract intake{% endblock %}</title>
  <style>
    /* Palette and type scale from a design pass in Lovable, ported by hand:
       the app is server-rendered Jinja reading the live database, so the design
       travels as CSS rather than as a second application. */
    :root {
      --bg:            #0b0d10;
      --surface:       #111419;
      --surface-raised:#161a20;
      --hover:         #141820;
      --border:        #1e232b;
      --border-strong: #2a3039;
      --text:          #a0aab7;
      --text-strong:   #d7dde6;
      --muted:         #6b7786;
      --accent:        #5f9e9e;
      --accent-dim:    #4a7f7f;
      --ok:            #4a7c54;  --ok-bg:     #14251a;  --ok-border:     #2a4a33;
      --warn:          #8c6d3f;  --warn-bg:   #1f1a12;  --warn-border:   #4a3a24;
      --bad:           #8b4a4a;  --bad-bg:    #211414;  --bad-border:    #4a2a2a;
      --radius: 4px;
      --ui:    "Inter", "SF Pro Text", system-ui, -apple-system, sans-serif;
      --prose: Georgia, "Times New Roman", serif;
      --mono:  ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--ui);
      font-size: 14px; line-height: 1.5; margin: 0; padding: 40px 24px 72px;
      -webkit-font-smoothing: antialiased;
    }
    main, header { max-width: 1100px; margin: 0 auto; }

    /* Tabs, not links. Underlined text at this size reads as a footnote, and a
       reviewer needs to know where they are before they read anything else. */
    header {
      display: flex; align-items: center; gap: 28px;
      padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 36px;
    }
    header > b {
      font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text-strong);
      letter-spacing: .04em;
    }
    header nav { display: flex; gap: 4px; }
    header nav a {
      text-decoration: none; padding: 6px 12px; border-radius: var(--radius);
      font-size: 12px; font-weight: 500; letter-spacing: .02em;
      color: var(--muted); border: 1px solid transparent;
    }
    header nav a:hover { color: var(--text-strong); background: var(--surface); }
    header nav a.on {
      color: #fff; background: var(--surface-raised); border-color: var(--border-strong);
    }

    h1 {
      font-family: var(--mono); font-size: 22px; font-weight: 500; letter-spacing: -.01em;
      color: var(--text-strong); margin: 0 0 12px;
    }
    h2 {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em;
      color: var(--muted); margin: 48px 0 18px;
    }
    p.sub { margin: 0 0 4px; font-size: 13px; color: var(--muted); }
    a { color: var(--accent); }

    .mono  { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    /* A figure the reader is meant to weigh -- a confidence, an amount, a count --
       carries full contrast. Everything around it does not, which is what makes
       it visible without any colour being spent on it. */
    .num   { font-family: var(--mono); font-variant-numeric: tabular-nums; color: #fff; }
    .muted { color: var(--muted); }
    .quote { font-family: var(--mono); font-size: 12px; font-style: italic; color: var(--text); }
    .cite  {
      font-family: var(--mono); font-size: 12px; color: var(--muted);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 1px 6px;
      margin-right: 10px;
    }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
      font-family: var(--prose); font-size: 15px; line-height: 1.6; color: var(--text-strong);
    }
    .card.high   { border-left: 3px solid var(--bad);  background: var(--bad-bg); }
    .card.medium { border-left: 3px solid var(--warn); background: var(--warn-bg); }

    table { width: 100%; border-collapse: collapse; font-size: 13px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden; }
    th, td { padding: 10px 14px; text-align: left; vertical-align: top;
             border-bottom: 1px solid var(--border); }
    th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
         color: var(--muted); background: var(--surface-raised); }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--hover); }
    td:first-child { color: var(--text-strong); font-weight: 500; }
    a.row { color: var(--text-strong); text-decoration: none; }
    a.row:hover { color: var(--accent); }

    .tag {
      display: inline-flex; align-items: center; padding: 2px 8px;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-family: var(--mono); font-size: 11px; line-height: 1.4;
      color: var(--text); background: var(--surface);
    }
    .tag.ok     { background: var(--ok-bg);   color: var(--ok);   border-color: var(--ok-border); }
    .tag.medium { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
    .tag.high   { background: var(--bad-bg);  color: var(--bad);  border-color: var(--bad-border); }

    details { border: 1px solid var(--border); border-radius: var(--radius);
              background: var(--surface); margin-bottom: 14px; }
    summary { padding: 13px 16px; cursor: pointer; font-size: 13px;
              color: var(--text); user-select: none; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "\25B8"; display: inline-block; margin-right: 8px;
                      color: var(--muted); transition: transform .15s ease; }
    details[open] summary::before { transform: rotate(90deg); }
    details > *:not(summary) { padding: 0 16px 16px; }

    input {
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 8px 10px; color: var(--text-strong); font-family: var(--mono);
      font-size: 13px; outline: none; transition: border-color .15s ease;
    }
    input:focus { border-color: var(--accent); }

    button {
      padding: 10px 20px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
      font-family: var(--ui); cursor: pointer; border: 1px solid var(--border);
      background: transparent; color: var(--text); margin-right: 10px;
      transition: background .15s ease, border-color .15s ease;
    }
    button:hover { background: var(--surface-raised); border-color: var(--border-strong); }
    button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    button.primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }

    /* A section that reads as one object: prose, then a disclosure or a form
       under a hairline divider, rather than a stack of separate boxes. */
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 14px;
    }
    .panel > .note {
      padding: 18px; font-family: var(--prose); font-size: 15px; line-height: 1.6;
      color: var(--text-strong); margin: 0;
    }
    .panel > .note.warn { background: var(--bad-bg); border-left: 3px solid var(--bad); }
    .panel > details { border: none; border-top: 1px solid var(--border);
                       border-radius: 0; margin: 0; background: transparent; }
    .panel > .actions {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 16px 18px; border-top: 1px solid var(--border);
    }
    .panel > .actions .muted { font-family: var(--prose); font-style: italic; }
    .panel table { border: none; border-radius: 0; }

    /* One heading per thing that is wrong, with the specific problems under it. */
    .concern-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .concern-head b { color: #fff; font-family: var(--ui); font-size: 13px;
                      letter-spacing: .02em; }
    .concern-line { font-size: 14px; line-height: 1.55; margin-top: 4px; }
    .concern-line + .concern-line { padding-top: 6px; border-top: 1px solid var(--border); }

    /* The shape of the evidence before any of it is read. */
    .bar { display: flex; height: 6px; border-radius: 2px; overflow: hidden;
           background: var(--border); margin: 0 0 10px; }
    .bar span.ok   { background: var(--ok); }
    .bar span.warn { background: var(--warn); }
    .bar span.bad  { background: var(--bad); }
    .bar span.none { background: var(--border-strong); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 0 0 18px;
              font-size: 12px; color: var(--muted); }
    .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px;
                margin-right: 7px; }
    .legend i.ok { background: var(--ok); } .legend i.warn { background: var(--warn); }
    .legend i.bad { background: var(--bad); } .legend i.none { background: var(--border-strong); }

    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 1px; background: var(--border); border: 1px solid var(--border);
      border-radius: var(--radius); margin: 18px 0 28px; overflow: hidden;
    }
    .stats > div { background: var(--surface); padding: 16px 18px; }
    .stats b {
      display: block; font-family: var(--mono); font-size: 26px; font-weight: 500;
      color: #fff; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
    }
    .stats span {
      display: block; margin-top: 4px; font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: .08em;
    }

    .empty { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <header>
    <b>contract intake</b>
    {% set here = request.url.path if request else '/' %}
    <nav>
      <a href="/"          class="{{ 'on' if here == '/' or here.startswith('/review') }}">Queue</a>
      <a href="/contracts" class="{{ 'on' if here == '/contracts' }}">Approved</a>
      <a href="/costs"     class="{{ 'on' if here == '/costs' }}">Costs</a>
    </nav>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>

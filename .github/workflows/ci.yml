name: CI

# A clean-machine check of the full setup path. A developer laptop with a warm
# pip cache proves nothing about a fresh checkout, and `make setup` is where a
# broken environment shows up first.
#
# No secrets required: the suite is hermetic, with no API key and no calls to
# Anthropic, so a green run here means the same thing it means locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Only the runner's own Python is cached; the project installs into
          # its own venv via `make setup`, on the same path as a fresh clone.
          cache: pip

      # Chroma downloads an ONNX embedding model on first use. Cached so the
      # 80MB fetch does not happen on every run.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-v1

      - name: make setup
        run: make setup PYTHON=python

      - name: make lint
        run: make lint

      - name: make test
        run: make test

      # Fixtures are generated rather than committed as binaries, so the
      # generator has to keep working -- the eval harness runs on its output.
      - name: Regenerate the fixtures
        run: .venv/bin/python evals/fixtures/generate.py

      - name: Check the pipeline chain is intact
        run: .venv/bin/python -m contract_intake.cli stages

name: CI

# A clean-machine check of the full setup path. A developer laptop with a warm
# pip cache proves nothing about a fresh checkout, and `make setup` is where a
# broken environment shows up first.
#
# No secrets required: everything here is hermetic, with no API key and no calls
# to Anthropic, so a green run means the same thing it means locally. What that
# does and does not cover is written down in docs/TESTING.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Only the runner's own Python is cached; the project installs into
          # its own venv via `make setup`, on the same path as a fresh clone.
          cache: pip

      # Chroma downloads an ONNX embedding model on first use. Cached so the
      # 80MB fetch does not happen on every run.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-v1

      - name: make setup
        run: make setup PYTHON=python

      - name: make lint
        run: make lint

      - name: make test
        run: make test

      # The corpus is kept as text and rendered to PDF, so the renderer has to
      # keep working: the behaviour check below runs on its output.
      - name: Render the document corpus
        run: .venv/bin/python evals/render.py

      # Not a unit test. This runs the real triage stage over every authored and
      # generated document and asserts each one is classified correctly -- both
      # the contracts that must pass and the lookalikes that must not. It costs
      # nothing, it caught two vocabulary defects that the unit tests did not,
      # and it is the only step here that exercises a pipeline stage end to end.
      #
      # The hundred collected TED notices are deliberately not fetched: that is
      # a network call to an external service, and a flaky third party must not
      # be able to fail this workflow. Run `make corpus && make triage` locally.
      - name: Classify every document (free, no API key)
        run: make triage

      # Two startup invariants that turn a silent stall into a crash: every
      # stage hands off to the next, and the models match the database on disk.
      - name: Check the pipeline chain and schema guard
        run: .venv/bin/python -m contract_intake.cli stages
